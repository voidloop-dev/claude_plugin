name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet pyyaml

      - name: Plugin manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            python -c "import json; json.load(open('$f')); print('ok:', '$f')"
          done

      - name: Skills present with required frontmatter
        run: python .github/scripts/check_skills.py

      - name: Reference YAML files parse
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if python -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"; then
              echo "ok:   $f"
            else
              echo "FAIL: $f"; fail=1
            fi
          done < <(find skills -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          exit $fail
