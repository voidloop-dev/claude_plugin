# Fill `package-ecosystem` from the detected stack:
#   npm | pip | cargo | gomod | bundler | gradle | maven | composer | pub
# Add one block per ecosystem present in the repo.
version: 2
updates:
  - package-ecosystem: "{{ECOSYSTEM}}"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
