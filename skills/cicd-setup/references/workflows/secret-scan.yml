# Add this job to ci.yml (or keep as its own workflow secret-scan.yml).
# Job name `secret-scan` is the contract used in branch protection.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only for orgs
