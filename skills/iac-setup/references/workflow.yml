# .github/workflows/terraform.yml
# plan on PR (comment), apply on merge. OIDC auth — no static cloud keys.
name: Terraform

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

concurrency:
  group: tf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # OIDC
  pull-requests: write   # plan comment

env:
  TF_VERSION: "1.9.5"

jobs:
  tf:
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && matrix.env == 'prod' && 'production' || '' }}
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ github.event_name == 'pull_request' && format('tf-plan-{0}', matrix.env) || format('tf-apply-{0}', matrix.env) }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --format compact

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/envs/${{ matrix.env }}
          quiet: true
          soft_fail: false

      - name: Plan
        id: plan
        run: terraform plan -input=false -lock-timeout=120s -out=tfplan
      - name: Show plan
        run: terraform show -no-color tfplan | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/${{ matrix.env }}/plan.txt','utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `### Terraform plan — \`${{ matrix.env }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -lock-timeout=120s tfplan
